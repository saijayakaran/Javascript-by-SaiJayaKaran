<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">
            To-Do List
            <input class="searchInput" type="search" placeholder="Search tasks...">
        </h1>
        <input placeholder="Add your task here" class="taskInput">
        <input type="date" class="dateInput">
        <input type="time" class="timeInput">
        <button class="addTask">Add Task</button>
        <h2>Today's Tasks</h2>
        <div class="todayTasks"></div>
        <h2>Upcoming Tasks</h2>
        <div class="upcomingTasks"></div>
        <h2>Due Tasks</h2>
        <div class="dueTasks"></div>
        <div class="errorPopup" style="display: none;">
            <p>Please fill in the fields</p>
            <button class="okButton">OK</button>
        </div>
    </div>
</body>
</html>
